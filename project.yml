name: LiveRecorder
options:
  bundleIdPrefix: com.livereccorder
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LiveRecorder:
    type: application
    platform: iOS
    sources:
      - path: LiveRecorder
    info:
      path: LiveRecorder/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livereccorder.app
        INFOPLIST_FILE: LiveRecorder/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
